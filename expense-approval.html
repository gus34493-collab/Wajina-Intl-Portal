<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Review Hub | Wajina Intl</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <script>
        // Accounts Officer: Tier 1, Director: Tier 2 (Final)
        window.REQUIRED_ROLES = ['DIRECTOR', 'ACCOUNTS_OFFICER'];
    </script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/telemetry.js"></script>
    <script src="/js/config/navigation.js"></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>
    <script src="/js/components/wajina-toast.js"></script>
    <style>
        .request-card {
            background: white;
            border-radius: 18px;
            padding: 1.5rem;
            border: 1.5px solid rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .request-card:hover {
            border-color: var(--brand-moonstone);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .status-pill {
            font-size: 0.6rem;
            font-weight: 800;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending { background: rgba(255, 198, 79, 0.1); color: #d97706; }
        .status-awaiting_director { background: rgba(81, 156, 171, 0.1); color: var(--brand-moonstone); }
        .status-approved { background: rgba(44, 194, 135, 0.1); color: #059669; }
        .status-denied { background: rgba(239, 68, 68, 0.1); color: #dc2626; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(32, 55, 59, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2.5rem;
        }
    </style>
</head>

<body>
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>

        <main class="main-content">
            <wajina-header title="Approval Management"></wajina-header>

            <div class="top-row" style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 id="pageTitle" style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Expense Verification</h1>
                    <p id="pageSub" style="font-size: 0.85rem; color: var(--text-secondary);">Review institutional expenditure requests and authorize disbursements.</p>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <label style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted);">Queue State</label>
                        <select id="stateFilter" class="glass" style="padding: 0.6rem 1rem; font-weight: 700;">
                            <option value="ACTIVE">Active Actions Required</option>
                            <option value="HISTORY">Completed Review History</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="loadingGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                <!-- Skeleton loader -->
                 <div style="grid-column: 1/-1; padding: 5rem; text-align: center; color: var(--text-muted);">
                    <i class="fa-solid fa-sync fa-spin fa-2x"></i>
                    <p style="margin-top: 1.5rem; font-weight: 600;">Scanning Financial Registry...</p>
                 </div>
            </div>

            <div id="requestGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 2rem; display: none;">
                <!-- Cards injected here -->
            </div>
        </main>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
                <div>
                    <h2 id="modalTitle" style="font-family: 'Sora', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem;">Expense Review</h2>
                    <span id="modalStatus" class="status-pill">PENDING</span>
                </div>
                <button onclick="closeModal()" style="background: rgba(0,0,0,0.05); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                <div>
                    <div style="margin-bottom: 1.5rem;">
                        <label style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Requested By</label>
                        <div id="modalSender" style="font-weight: 700; font-size: 1rem;">John Doe</div>
                        <div id="modalRole" style="font-size: 0.75rem; color: var(--text-secondary);">Head Teacher · Primary</div>
                    </div>
                    <div>
                        <label style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Justification</label>
                        <p id="modalDesc" style="font-size: 0.9rem; line-height: 1.6; color: var(--brand-gunmetal); margin-top: 0.5rem;"></p>
                    </div>
                </div>
                <div id="modalEvidence" style="border-radius: 16px; min-height: 250px; background: #f8f9fa; border: 1.5px solid rgba(0,0,0,0.05); overflow: hidden; display: grid; place-items: center;">
                    <!-- Evidence image/link -->
                </div>
            </div>

            <div id="actionArea">
                <label style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 0.5rem;">Process Action & Feedback</label>
                <textarea id="feedbackReason" class="glass" placeholder="Enter reason for your decision..." style="width: 100%; height: 100px; padding: 1rem; margin-bottom: 1.5rem;"></textarea>
                
                <div style="display: flex; gap: 1rem;">
                    <button onclick="processRequest('deny')" style="flex: 1; padding: 1rem; border-radius: 12px; border: 1.5px solid #ef4444; color: #ef4444; background: white; font-weight: 700; cursor: pointer;">Deny Request</button>
                    <button id="approveBtn" onclick="processRequest('approve')" style="flex: 2; padding: 1rem; border-radius: 12px; border: none; color: white; background: var(--brand-gunmetal); font-weight: 700; cursor: pointer;">Approve & Forward</button>
                </div>
            </div>

            <div id="historyFeedback" style="display: none; padding: 1.5rem; border-radius: 16px; background: rgba(32, 55, 59, 0.03); border: 1.5px solid rgba(0,0,0,0.03);">
                <label style="font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Decision Feedback</label>
                <p id="feedbackText" style="font-size: 0.9rem; margin-top: 0.5rem; font-weight: 600;"></p>
            </div>
        </div>
    </div>

    <script>
        const apiFetch = window.Wajina.apiFetch;
        const toast = (m, t) => window.Wajina.toast?.show(m, t);
        const esc = (s) => window.Wajina.DOMUtils.escapeHTML(s);

        let currentUser = null;
        let activeRequests = [];
        let currentRequestId = null;

        async function init(e) {
            currentUser = e.detail.user;
            
            // Adjust page based on role
            if (currentUser.role === 'DIRECTOR') {
                document.getElementById('pageTitle').textContent = 'Directorate Authorizations';
                document.getElementById('pageSub').textContent = 'Final signatory queue for institutional disbursements.';
                document.getElementById('approveBtn').textContent = 'Authorize Disbursement';
            }

            await loadRequests();
        }

        async function loadRequests() {
            const grid = document.getElementById('requestGrid');
            const loading = document.getElementById('loadingGrid');
            const filter = document.getElementById('stateFilter').value;

            grid.style.display = 'none';
            loading.style.display = 'grid';

            try {
                // Fetch all expense requests
                const { requests } = await apiFetch('/api/requests?category=EXPENSE');
                
                // Tiered Visibility logic
                let filtered = [];
                if (filter === 'ACTIVE') {
                    if (currentUser.role === 'ACCOUNTS_OFFICER') {
                        filtered = requests.filter(r => r.status === 'PENDING');
                    } else if (currentUser.role === 'DIRECTOR') {
                        filtered = requests.filter(r => r.status === 'AWAITING_DIRECTOR');
                    }
                } else {
                    // History
                    filtered = requests.filter(r => ['APPROVED', 'DENIED'].includes(r.status));
                    // Also show AWAITING_DIRECTOR in AO history
                    if (currentUser.role === 'ACCOUNTS_OFFICER') {
                        filtered = requests.filter(r => ['APPROVED', 'DENIED', 'AWAITING_DIRECTOR'].includes(r.status));
                    }
                }

                activeRequests = filtered;
                renderGrid(filtered);

            } catch (err) {
                toast(err.message, 'error');
            } finally {
                loading.style.display = 'none';
                grid.style.display = 'grid';
            }
        }

        function renderGrid(requests) {
            const grid = document.getElementById('requestGrid');
            if (requests.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; padding: 5rem; text-align: center; color: var(--text-muted);">No requests found in this queue.</div>';
                return;
            }

            grid.innerHTML = requests.map(r => `
                <div class="request-card" onclick="openReview('${r.id}')">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <span class="status-pill status-${r.status.toLowerCase()}">${r.status.replace(/_/g, ' ')}</span>
                        <div style="font-size: 0.7rem; color: var(--text-muted); font-weight: 700;">${new Date(r.createdAt).toLocaleDateString()}</div>
                    </div>
                    <div style="font-weight: 800; font-size: 1.1rem; color: var(--brand-gunmetal);">${esc(r.title)}</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">${esc(r.sender.name)} · ${esc(r.sender.role)}</div>
                    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; pt: 1rem; border-top: 1px solid rgba(0,0,0,0.02); padding-top: 1rem;">
                        <div style="font-size: 0.75rem; font-weight: 700; color: var(--brand-moonstone);">View Documentation <i class="fa-solid fa-arrow-right ml-1"></i></div>
                    </div>
                </div>
            `).join('');
        }

        function openReview(id) {
            const r = activeRequests.find(x => x.id === id);
            if (!r) return;

            currentRequestId = id;
            document.getElementById('modalTitle').textContent = r.title;
            const statusEl = document.getElementById('modalStatus');
            statusEl.textContent = r.status.replace(/_/g, ' ');
            statusEl.className = `status-pill status-${r.status.toLowerCase()}`;

            document.getElementById('modalSender').textContent = r.sender.name;
            document.getElementById('modalRole').textContent = `${r.sender.role} · ${r.sender.campus || 'Global'}`;
            document.getElementById('modalDesc').textContent = r.description;

            const evidence = document.getElementById('modalEvidence');
            if (r.fileUrl) {
                if (r.fileUrl.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                    evidence.innerHTML = `<img src="${r.fileUrl}" style="max-width: 100%; height: auto; border-radius: 8px;">`;
                } else {
                    evidence.innerHTML = `<div style="text-align: center;"><i class="fa-solid fa-file-pdf fa-4x" style="color: #ef4444; margin-bottom: 1rem; display: block;"></i><a href="${r.fileUrl}" target="_blank" style="font-weight: 800; color: var(--brand-moonstone); text-decoration: none;">Download Document</a></div>`;
                }
            } else {
                evidence.innerHTML = '<span style="color: var(--text-muted); font-weight: 700;">No Evidence Attached</span>';
            }

            const actionArea = document.getElementById('actionArea');
            const historyArea = document.getElementById('historyFeedback');
            if (['APPROVED', 'DENIED'].includes(r.status) || (currentUser.role === 'ACCOUNTS_OFFICER' && r.status === 'AWAITING_DIRECTOR')) {
                actionArea.style.display = 'none';
                historyArea.style.display = 'block';
                document.getElementById('feedbackText').textContent = r.feedback || 'Decision finalized without specific note.';
            } else {
                actionArea.style.display = 'block';
                historyArea.style.display = 'none';
                document.getElementById('feedbackReason').value = '';
            }

            document.getElementById('reviewModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        async function processRequest(action) {
            const reason = document.getElementById('feedbackReason').value;
            if (!reason && action === 'deny') {
                toast('Justification is required for denials.', 'error');
                return;
            }

            try {
                await apiFetch(`/api/requests/${currentRequestId}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ action, reason })
                });

                toast(`Expense ${action === 'approve' ? 'forwarded/authorized' : 'denied'} successfully.`, 'success');
                closeModal();
                loadRequests();
            } catch (err) {
                toast(err.message, 'error');
            }
        }

        document.getElementById('stateFilter').addEventListener('change', loadRequests);
        window.addEventListener('authReady', init);
    </script>
</body>

</html>
