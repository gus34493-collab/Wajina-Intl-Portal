<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Performance Analytics | Wajina Intl</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background: var(--brand-bg); }
        .subject-card { border-left: 5px solid var(--brand-moonstone); transition: transform 0.2s; }
        .subject-card:hover { transform: scale(1.02); }
        .score-display { font-size: 2.5rem; font-weight: 800; letter-spacing: -2px; }
        .top-performer { color: var(--brand-emerald-light); }
        .low-performer { color: #e74c3c; }
    </style>
    <script src="/js/config/navigation.js"></script>
</head>
<body data-onion-stage="pulse">
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>
        <main class="main-content">
            <wajina-header title="Subject Intelligence"></wajina-header>
            
            <div class="top-row">
                <h1 style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.4rem;">Performance Analytics</h1>
                <p style="font-size: 0.9rem; color: var(--text-muted); font-weight: 600;">Deep-dive subject performance metrics across the institution.</p>
            </div>

            <div class="card" style="margin-top: 2rem; display: flex; gap: 1.5rem; align-items: center;">
                <div style="flex: 1; position: relative;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--brand-moonstone);"></i>
                    <input type="text" id="subjectSearch" placeholder="Filter by subject nomenclature..." class="glass" style="width: 100%; padding: 1rem 1rem 1rem 3rem; font-weight: 700;">
                </div>
            </div>

            <div id="subjectGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                <div style="grid-column: 1/-1; text-align: center; padding: 5rem; color: var(--text-muted);">Aggregating Subject Metrics...</div>
            </div>
        </main>
    </div>

    <script>
        const apiFetch = window.Wajina.apiFetch;
        const esc = window.Wajina.DOMUtils.escapeHTML;
        let subjects = [];

        async function init() {
            try {
                const res = await apiFetch('/api/analytics/subjects');
                subjects = res.subjects || [];
                renderSubjects(subjects);
            } catch (err) {
                console.error('Performance analytics error:', err);
            }
        }

        function renderSubjects(data) {
            const grid = document.getElementById('subjectGrid');
            if (data.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 5rem; color: var(--text-muted);">Zero subject data found in current academic vector.</div>';
                return;
            }

            grid.innerHTML = data.map(s => {
                const colorClass = s.average >= 70 ? 'top-performer' : (s.average < 45 ? 'low-performer' : '');
                const trendIcon = s.average >= 70 ? 'fa-arrow-trend-up' : (s.average < 45 ? 'fa-arrow-trend-down' : 'fa-minus');
                
                return `
                    <div class="card subject-card">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
                            <div>
                                <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--brand-gunmetal); margin-bottom: 0.25rem;">${esc(s.name)}</h3>
                                <p style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">${esc(s.className)}</p>
                            </div>
                            <i class="fa-solid ${trendIcon} ${colorClass}" style="font-size: 1.25rem; opacity: 0.8;"></i>
                        </div>
                        <div style="display: flex; align-items: baseline; gap: 0.5rem;">
                            <div class="score-display ${colorClass}">${s.average}</div>
                            <div style="font-size: 0.8rem; font-weight: 800; color: var(--text-muted); opacity: 0.6;">AVG SCORE</div>
                        </div>
                        <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid rgba(0,0,0,0.03);">
                            <span style="font-size: 0.7rem; font-weight: 800; color: var(--text-muted);">${s.studentCount} SCHOLARS ENROLLED</span>
                            <span style="font-size: 0.7rem; font-weight: 900; color: var(--brand-moonstone); cursor: pointer;" onclick="location.href='/review-grades.html?subject=${s.id}'">VIEW DATA →</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('subjectSearch').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            const filtered = subjects.filter(s => s.name.toLowerCase().includes(q) || s.className.toLowerCase().includes(q));
            renderSubjects(filtered);
        });

        window.addEventListener('authReady', init);
    </script>
</body>
</html>
