# ──────────────────────────────────────────────────────────────────────────────
# Wajina International Schools — DigitalOcean App Platform Spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# FIRST-TIME SETUP:
#   1. Create a Managed PostgreSQL cluster in DO (Databases tab)
#   2. Create a Spaces bucket named "wajina-report-cards" (Spaces tab)
#   3. Create a Spaces Access Key (API tab → Spaces Keys)
#   4. Connect this repo in the App Platform and paste this spec
#   5. Set SECRET env vars in the App Platform dashboard (marked below)
#
# DEPLOY:  doctl apps create --spec .do/app.yaml
# UPDATE:  doctl apps update <app-id> --spec .do/app.yaml
# ──────────────────────────────────────────────────────────────────────────────

name: wajina-portal
region: fra       # Frankfurt — lowest latency from Nigeria; options: nyc, ams, sgp, syd, blr

services:

  # ── Next.js Web Dashboard ────────────────────────────────────────────────
  # Handles all public traffic. Routes /api/* to Express internally unless a
  # matching Next.js API route exists (Next.js routes always take priority).
  - name: web
    github:
      repo: YOUR_GITHUB_ORG/wajina-intl-portal   # ← update this
      branch: main
      deploy_on_push: true
    build_command: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: professional-xs     # 1 vCPU / 512 MB — bump to professional-s for prod traffic
    http_port: 3000
    routes:
      - path: /
    health_check:
      http_path: /api/health
      timeout_seconds: 10
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

      # ── Express proxy — internal URL of the api service
      - key: EXPRESS_API_URL
        scope: RUN_AND_BUILD_TIME
        value: "${api.PRIVATE_URL}"

      # ── Database — injected from the attached managed cluster
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: "${db.DATABASE_URL}"
      - key: DIRECT_URL
        scope: RUN_AND_BUILD_TIME
        value: "${db.DATABASE_URL}"

      # ── Public URL
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: "${APP_URL}"

      # ── Auth — set these as secrets in the DO dashboard
      - key: JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── Email
      - key: RESEND_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: EMAIL_FROM
        scope: RUN_AND_BUILD_TIME
        value: "Wajina Portal <noreply@wajina.edu.ng>"

      # ── DO Spaces (report card PDF storage)
      - key: DO_SPACES_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_SPACES_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_SPACES_ENDPOINT
        scope: RUN_AND_BUILD_TIME
        value: "https://fra1.digitaloceanspaces.com"
      - key: DO_SPACES_REGION
        scope: RUN_AND_BUILD_TIME
        value: "fra1"
      - key: DO_SPACES_BUCKET
        scope: RUN_AND_BUILD_TIME
        value: "wajina-report-cards"

      # ── Push notifications (VAPID)
      - key: VAPID_PUBLIC_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: VAPID_PRIVATE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: VAPID_EMAIL
        scope: RUN_AND_BUILD_TIME
        value: "mailto:admin@wajina.edu.ng"

      # ── Payments (Flutterwave)
      - key: FLW_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: FLW_PUBLIC_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: FLW_WEBHOOK_HASH
        scope: RUN_AND_BUILD_TIME
        type: SECRET

  # ── Express API Backend (internal — not publicly reachable) ────────────────
  # Serves legacy API routes during the Next.js migration. Next.js proxies
  # requests here for any /api/* path it does not handle locally.
  # Remove this service once all routes are migrated to Next.js App Router.
  - name: api
    github:
      repo: YOUR_GITHUB_ORG/wajina-intl-portal   # ← same repo
      branch: main
      deploy_on_push: true
    build_command: npm ci && npx prisma generate && npx prisma migrate deploy
    run_command: npx tsx server/index.ts
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: professional-xs
    http_port: 3001
    internal_ports:
      - 3001
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3001"

      # ── Database
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: "${db.DATABASE_URL}"
      - key: DIRECT_URL
        scope: RUN_AND_BUILD_TIME
        value: "${db.DATABASE_URL}"

      # ── Auth
      - key: JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── CORS — allow the web service origin only
      - key: CORS_ORIGIN
        scope: RUN_AND_BUILD_TIME
        value: "${web.PUBLIC_URL}"

      # ── Email
      - key: RESEND_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── Payments
      - key: FLW_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: FLW_WEBHOOK_HASH
        scope: RUN_AND_BUILD_TIME
        type: SECRET

      # ── Push
      - key: VAPID_PUBLIC_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: VAPID_PRIVATE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: VAPID_EMAIL
        scope: RUN_AND_BUILD_TIME
        value: "mailto:admin@wajina.edu.ng"

# ── Managed PostgreSQL ────────────────────────────────────────────────────────
# If you already created a cluster in the DO dashboard, remove this block and
# instead add the cluster as an "existing database" in the App Platform UI.
# The ${db.*} bindings above will still work either way.
databases:
  - name: db
    engine: PG
    version: "17"
    size: db-s-1vcpu-1gb     # Cheapest single-node — upgrade to db-s-2vcpu-4gb for production load
    num_nodes: 1              # Set to 2 for standby HA replica
    production: true
