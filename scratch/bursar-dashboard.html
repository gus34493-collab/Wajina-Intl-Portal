<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bursar Hub | Wajina Intl Portal</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="/vendors/font-awesome/all.min.css">
    <link href="/vendors/google-fonts/fonts.css" rel="stylesheet">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;">
    <script>
        window.REQUIRED_ROLES = ['DIRECTOR', 'PRINCIPAL', 'BURSAR', 'ACCOUNTS_OFFICER'];
    </script>

    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/telemetry.js"></script>
    <script src="/js/config/navigation.js"></script>
    <script src="/vendors/chartjs/chart.min.js"></script>
    <script src="/vendors/dompurify/purify.min.js" defer></script>
    <script src="/sanitize.js" defer></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>

</head>
<body>
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>

        <main class="main-content">
            <wajina-header title="Financial Management"></wajina-header>

            <div class="top-row">
                <h1 id="welcomeUser" style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Treasury Command</h1>
                <p id="subText" style="font-size: 0.85rem; color: var(--text-secondary);">Overseeing institutional liquidity and payment integrity.</p>
            </div>

            <div style="display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 1.5rem; margin-bottom: 2rem;">
                <!-- Collection Efficiency -->
                <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                    <h3 style="font-size: 0.9rem; align-self: flex-start; margin-bottom: 2rem;">Collection Efficiency</h3>
                    <div style="width: 200px; height: 200px; position: relative;">
                        <canvas id="gaugeChart"></canvas>
                    </div>
                    <div style="margin-top: 1rem;">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Budget Target</span>
                        <div style="font-weight: 700; color: var(--brand-saffron);" id="gaugeValueDisplay">0%</div>
                    </div>
                </div>

                <!-- Stats Column -->
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="card" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 style="font-size: 0.8rem; color: var(--text-secondary);">Today's Collection</h3>
                            <i class="fa-solid fa-wallet" style="color: var(--brand-moonstone); font-size: 1.2rem;"></i>
                        </div>
                        <div id="totalCollected" style="font-size: 1.8rem; font-weight: 800; letter-spacing: -1px;">Géª --</div>
                    </div>
                    <div class="card" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                         <div style="display: flex; justify-content: space-between; align-items: center;">
                             <h3 style="font-size: 0.8rem; color: var(--text-secondary);">Target Gap</h3>
                             <i class="fa-solid fa-chart-line" style="color: var(--brand-saffron); font-size: 1.2rem;"></i>
                         </div>
                         <div id="targetGap" style="font-size: 1.8rem; font-weight: 800; color: #ef4444;">Géª --</div>
                    </div>
                </div>

                <!-- Velocity Chart -->
                <div class="card" style="display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="font-size: 0.9rem;">Collection Velocity</h3>
                    </div>
                    <div style="flex: 1; position: relative;"><canvas id="trendsChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/pages/bursar.js" defer></script>
</body>
</body>
</html>
