<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Expense | Wajina Intl</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <script>
        // Only Management can issue formal expenses
        window.REQUIRED_ROLES = ['DIRECTOR', 'PRINCIPAL', 'HEAD_TEACHER', 'ASST_HEAD_TEACHER', 'VP_ADMIN', 'VP_ACADEMICS'];
    </script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/telemetry.js"></script>
    <script src="/js/config/navigation.js"></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>
    <script src="/js/components/wajina-toast.js"></script>
    <style>
        .expense-form-card {
            max-width: 650px;
            margin: 2rem auto;
            padding: 3rem;
            background: white;
            border-radius: 24px;
            border: 1.5px solid rgba(0,0,0,0.03);
            box-shadow: 0 20px 50px rgba(0,0,0,0.04);
        }

        .form-section-title {
            font-family: 'Sora', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--brand-gunmetal);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .receipt-dropzone {
            border: 2px dashed rgba(81, 156, 171, 0.2);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            background: rgba(81, 156, 171, 0.02);
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .receipt-dropzone:hover {
            border-color: var(--brand-moonstone);
            background: rgba(81, 156, 171, 0.05);
        }

        .receipt-dropzone input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .preview-area {
            margin-top: 1rem;
            display: none;
        }

        .preview-image {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>

        <main class="main-content">
            <wajina-header title="Operations Console"></wajina-header>

            <div class="top-row">
                <h1 style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Expense Issuance</h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Submit formal expenditure requests for verification and directorate authorization.</p>
            </div>

            <div class="expense-form-card">
                <form id="expenseForm">
                    <div class="form-section-title">
                        <i class="fa-solid fa-file-invoice-dollar" style="color: var(--brand-moonstone);"></i>
                        Expenditure Details
                    </div>

                    <div class="input-group">
                        <label>Expense Subject</label>
                        <input type="text" id="title" class="glass" placeholder="e.g. Science Lab Consumables" required style="width: 100%; padding: 0.85rem; font-weight: 700;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="input-group">
                            <label>Amount (₦)</label>
                            <input type="number" id="amount" class="glass" placeholder="0.00" required style="width: 100%; padding: 0.85rem; font-weight: 800;">
                        </div>
                        <div class="input-group">
                            <label>Classification</label>
                            <select id="level" class="glass" required style="width: 100%; padding: 0.85rem; font-weight: 800;">
                                <option value="K1">Critical (Impact Level 1)</option>
                                <option value="K2" selected>Standard (Impact Level 2)</option>
                                <option value="K3">Minor (Impact Level 3)</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Justification & Description</label>
                        <textarea id="description" class="glass" placeholder="Provide detailed institutional justification..." required style="width: 100%; height: 120px; padding: 0.85rem; font-family: inherit; resize: none;"></textarea>
                    </div>

                    <div class="form-section-title" style="margin-top: 2.5rem;">
                        <i class="fa-solid fa-camera" style="color: var(--brand-moonstone);"></i>
                        Evidence & Receipts
                    </div>

                    <div class="receipt-dropzone" id="dropzone">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem; color: var(--brand-moonstone); margin-bottom: 1rem; display: block;"></i>
                        <span style="font-size: 0.85rem; font-weight: 700; color: var(--brand-gunmetal);">Click or Drag Receipt Copy</span>
                        <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem;">Supported: PDF, JPG, PNG (Max 5MB)</p>
                        <input type="file" id="receiptFile" accept="image/*,.pdf" required>
                    </div>

                    <div id="previewArea" class="preview-area">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <span style="font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--brand-moonstone);">Selected Evidence</span>
                            <button type="button" id="clearFile" style="background: none; border: none; font-size: 0.7rem; font-weight: 700; color: #ef4444; cursor: pointer;">Remove</button>
                        </div>
                        <img id="filePreview" class="preview-image">
                        <div id="pdfMessage" style="display: none; padding: 1rem; background: rgba(0,0,0,0.03); border-radius: 8px; font-size: 0.8rem; font-weight: 600;">
                            <i class="fa-solid fa-file-pdf mr-2"></i> PDF Document Attached
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="glass" style="width: 100%; margin-top: 3rem; padding: 1rem; background: var(--brand-gunmetal); color: white; font-weight: 800; border: none; letter-spacing: 0.05em;">
                        TRANSMIT TO ACCOUNTS OFFICER
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const apiFetch = window.Wajina.apiFetch;
        const toast = (m, t) => window.Wajina.toast?.show(m, t);

        const form = document.getElementById('expenseForm');
        const fileInput = document.getElementById('receiptFile');
        const previewArea = document.getElementById('previewArea');
        const filePreview = document.getElementById('filePreview');
        const pdfMessage = document.getElementById('pdfMessage');
        const dropzone = document.getElementById('dropzone');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            dropzone.style.display = 'none';
            previewArea.style.display = 'block';

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    filePreview.src = re.target.result;
                    filePreview.style.display = 'block';
                    pdfMessage.style.display = 'none';
                }
                reader.readAsDataURL(file);
            } else {
                filePreview.style.display = 'none';
                pdfMessage.style.display = 'block';
            }
        });

        document.getElementById('clearFile').addEventListener('click', () => {
            fileInput.value = '';
            dropzone.style.display = 'block';
            previewArea.style.display = 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const amount = document.getElementById('amount').value;
            const title = document.getElementById('title').value;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> TRANSMITTING...';

            try {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                formData.append('title', `[EXPENSE] ${title} (₦${Number(amount).toLocaleString()})`);
                formData.append('description', document.getElementById('description').value);
                formData.append('level', document.getElementById('level').value);
                formData.append('category', 'EXPENSE');

                await apiFetch('/api/requests/upload', {
                    method: 'POST',
                    body: formData
                });

                toast('Expense request transmitted successfully. Awaiting Accounts Officer review.', 'success');
                form.reset();
                dropzone.style.display = 'block';
                previewArea.style.display = 'none';
            } catch (err) {
                toast(err.message || 'Transmission failure', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'TRANSMIT TO ACCOUNTS OFFICER';
            }
        });
    </script>
</body>

</html>
