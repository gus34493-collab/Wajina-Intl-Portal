<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Command | Wajina Intl</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="/vendors/font-awesome/all.min.css">
    <link href="/vendors/google-fonts/fonts.css" rel="stylesheet">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;">
    <script>
        // RBAC: Leadership Command Dashboard
        window.REQUIRED_ROLES = ['DIRECTOR', 'VP_ACADEMICS', 'ASST_HEAD_TEACHER'];
    </script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/telemetry.js"></script>
    <script src="/js/config/navigation.js"></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>
    <script src="/js/components/wajina-toast.js"></script>
    <script src="/js/components/wajina-analytics.js"></script>
    <script src="/vendors/chartjs/chart.min.js"></script>

</head>

<body style="background: var(--brand-bg);">
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>

        <main class="main-content">
            <wajina-header title="Leadership Intelligence"></wajina-header>

            <div class="top-row">
                <h1 id="welcomeUser" style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Command Overview</h1>
                <p id="subText" style="font-size: 0.85rem; color: var(--text-secondary);">Overseeing institutional health and campus logistics.</p>
            </div>

            <!-- OPPO GRID: Row 1 -->
            <div style="display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 1.5rem;">
                
                <!-- Attendance Gauge -->
                <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
                    <h3 style="font-size: 0.9rem; align-self: flex-start; margin-bottom: 2rem;">Daily Attendance</h3>
                    <div style="width: 200px; height: 200px; position: relative;">
                        <canvas id="gaugeChart"></canvas>
                    </div>
                    <div style="margin-top: 1rem;">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Current Rate</span>
                        <div style="font-weight: 700; color: var(--brand-moonstone);" id="gaugeValueDisplay">0%</div>
                    </div>
                </div>

                <!-- Small Stats Column -->
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="card" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 id="statLabel1" style="font-size: 0.8rem; color: var(--text-secondary);">Pending Results</h3>
                            <i class="fa-solid fa-file-signature" style="color: var(--brand-saffron); font-size: 1.2rem;"></i>
                        </div>
                        <div>
                            <div id="statValue1" style="font-size: 2.2rem; font-weight: 800; letter-spacing: -1px;">--</div>
                        </div>
                    </div>
                    <div class="card" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                         <div style="display: flex; justify-content: space-between; align-items: center;">
                             <h3 id="statLabel2" style="font-size: 0.8rem; color: var(--text-secondary);">Active Incidents</h3>
                             <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 1.2rem;"></i>
                         </div>
                         <div id="statValue2" style="font-size: 2.2rem; font-weight: 800;">--</div>
                    </div>
                </div>

                <!-- Trends Chart -->
                <div class="card" style="display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="font-size: 0.9rem;">Attendance Trends</h3>
                        <div class="dropdown-mini glass" style="padding: 0.4rem 0.6rem; font-size: 0.7rem; font-weight: 700;">
                            7 Days <i class="fa-solid fa-chevron-down ml-1"></i>
                        </div>
                    </div>
                    <div style="flex: 1; position: relative;">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- OPPO GRID: Row 2 -->
            <div style="display: grid; grid-template-columns: 1fr 2.2fr; gap: 1.5rem;">
                
                <!-- Urgent Alerts -->
                <div class="card" style="display: flex; flex-direction: column;">
                    <h3 style="font-size: 0.9rem; margin-bottom: 2rem;">Urgent Alerts</h3>
                    <div id="mainFeed" style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <div style="text-align: center; color: var(--text-muted); padding: 2rem;">Fetching command data...</div>
                    </div>
                </div>

                <!-- Academic Integrity Insight -->
                <div class="card" style="display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                         <h3 style="font-size: 0.9rem;">Institutional Health Profile</h3>
                         <div class="dropdown-mini glass" style="padding: 0.4rem 0.6rem; font-size: 0.7rem; font-weight: 700;">
                             Metrics Matrix <i class="fa-solid fa-chevron-down ml-1"></i>
                         </div>
                    </div>
                    <div style="flex: 1; position: relative; min-height: 250px;">
                        <canvas id="integrityChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/vendors/dompurify/purify.min.js" defer></script>
    <script src="/sanitize.js" defer></script>
    <script src="/js/pages/academic-admin-dashboard.js" defer></script>
</body></html>
