<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Governance Approvals Queue | Wajina Intl</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="/vendors/font-awesome/all.min.css">
    <link href="/vendors/google-fonts/fonts.css" rel="stylesheet">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;">
    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/telemetry.js"></script>
    <script src="/vendors/dompurify/purify.min.js" defer></script>
    <script src="/sanitize.js" defer></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>
    <script src="/js/components/wajina-toast.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--brand-bg);
        }

        .approval-card {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 2rem;
            align-items: center;
            padding: 1.5rem 2rem;
            transition: all 0.2s ease;
        }

        .approval-card:hover {
            transform: translateY(-3px);
            border-color: var(--brand-moonstone);
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            background: rgba(81, 156, 171, 0.1);
            color: var(--brand-moonstone);
        }

        .empty-state {
            text-align: center;
            padding: 8rem 2rem;
            border: 1.5px dashed rgba(0,0,0,0.05);
            border-radius: 20px;
            background: white;
        }
    </style>
</head>
<body data-onion-stage="pulse">
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>
        
        <main class="main-content">
            <wajina-header title="Institutional Governance Hub"></wajina-header>
            
            <div class="top-row">
                <h1 id="welcomeUser" style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Multi-Signature Queue</h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">High-sensitivity administrative decisions requiring final sign-off.</p>
            </div>

            <div id="queueList" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                <!-- Polling signatures... -->
                <div style="text-align: center; padding: 5rem; color: var(--text-muted);">
                    <i class="fa-solid fa-sync fa-spin fa-2x"></i>
                    <p style="margin-top: 1.5rem; font-weight: 700;">Polling Multi-Signature Protocol...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/pages/approvals-queue.js" defer></script>
</body>

</body>
</html>
