<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Personnel Registration | Wajina Intl</title>
    <link rel="stylesheet" href="/css/onion-core.css">
    <link rel="stylesheet" href="/vendors/font-awesome/all.min.css">
    <link href="/vendors/google-fonts/fonts.css" rel="stylesheet">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;">
    <script src="/js/auth-guard.js"></script>
    <script src="/js/dom-utils.js"></script>
    <script src="/js/telemetry.js"></script>
    <script src="/vendors/dompurify/purify.min.js" defer></script>
    <script src="/sanitize.js" defer></script>
    <script src="/js/components/wajina-sidebar.js"></script>
    <script src="/js/components/wajina-header.js"></script>
    <script src="/js/components/wajina-toast.js"></script>

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--brand-bg);
        }

        .form-panel {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            max-width: 550px;
            width: 100%;
            border: 1.5px solid rgba(0,0,0,0.03);
            box-shadow: 0 20px 50px rgba(0,0,0,0.04);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .notice-box {
            background: rgba(81, 156, 171, 0.05);
            border-radius: 12px;
            padding: 1.25rem;
            border-left: 4px solid var(--brand-moonstone);
            margin: 2rem 0;
        }

        .notice-box p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0;
            font-weight: 600;
        }
    </style>

</head>
<body data-onion-stage="pulse">
    <div class="dashboard-layout" id="dashboardLayout">
        <wajina-sidebar></wajina-sidebar>
        
        <main class="main-content">
            <wajina-header title="Personnel Operations"></wajina-header>
            
            <div class="top-row">
                <h1 id="welcomeUser" style="font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.4rem;">Personnel Registration</h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Initialize institutional credentials and assign secure system privileges.</p>
            </div>

            <div style="display: flex; justify-content: center; margin-top: 3rem;">
                <div class="form-panel">
                    <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--brand-gunmetal); margin-bottom: 2rem; border-bottom: 1.5px solid rgba(0,0,0,0.03); padding-bottom: 1rem;">Protocol: New Staff Onboarding</h3>

                    <form id="onboardForm">
                        <div class="form-group">
                            <label>Full Nomenclature</label>
                            <input type="text" id="staffName" class="glass" placeholder="e.g. John Doe" required style="width: 100%; padding: 0.85rem; font-weight: 700;">
                        </div>

                        <div class="form-group">
                            <label>Institutional Email</label>
                            <input type="email" id="staffEmail" class="glass" placeholder="name@wajinaschools.com" required style="width: 100%; padding: 0.85rem; font-weight: 700;">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label>Privilege Tier</label>
                                <select id="staffRole" class="glass" required style="width: 100%; padding: 0.85rem; font-weight: 800;">
                                    <option value="">Select Category...</option>
                                    <option value="TEACHER">Academic: Teacher</option>
                                    <option value="HOD">Head of Department</option>
                                    <option value="PRINCIPAL">Institutional Principal</option>
                                    <option value="ASST_HEAD_TEACHER">Assistant Head Teacher</option>
                                    <option value="ADMIN_STAFF">Operations Hub</option>
                                    <option value="BURSAR">Bursar / Finance</option>
                                    <option value="ACCOUNTS_OFFICER">Accounts Officer</option>
                                </select>
                            </div>

                            <div class="form-group" id="campusGroup">
                                <label>Campus Locus</label>
                                <select id="staffCampus" class="glass" required style="width: 100%; padding: 0.85rem; font-weight: 800;">
                                    <option value="PRIMARY">Primary Academy</option>
                                    <option value="JUNIOR_SECONDARY">Junior College</option>
                                    <option value="SENIOR_SECONDARY">Senior College</option>
                                </select>
                            </div>
                        </div>

                        <div class="notice-box">
                            <p>
                                <i class="fa-solid fa-shield-halved mr-2" style="color: var(--brand-moonstone);"></i>
                                <strong>SECURITY PROTOCOL:</strong> Standard credential <strong>Wajina2026!</strong> will be provisioned. Mandatory password rotation is enforced on first entry.
                            </p>
                        </div>

                        <button type="submit" id="submitBtn" class="glass" style="width: 100%; padding: 1rem; background: var(--brand-gunmetal); color: white; border: none; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">
                            <i class="fa-solid fa-user-plus mr-2"></i> AUTHORIZE & REGISTER PERSONNEL
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/pages/staff-onboarding.js" defer></script>
</body>

</body>
</html>
