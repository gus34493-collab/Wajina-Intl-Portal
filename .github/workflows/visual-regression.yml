name: Visual Regression (Percy)

on:
  pull_request:
    branches: [main]

concurrency:
  group: percy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Percy Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-testing-secret-key-minimum-32-chars' }}
      RESEND_API_KEY: re_ci_placeholder
      APP_URL: http://localhost:3000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build

      - name: Start production server
        run: npm start &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Percy visual snapshots
        run: npx @percy/cli exec -- npx playwright test tests/visual/ --reporter=list
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
